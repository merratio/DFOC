<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DFA Compiler &amp; Visualizer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #1e1e1e;          /* matches Monaco vs-dark */
      --bar: #181a1f;
      --panel: #1c2027;
      --line: #2e343e;
      --text: #d9dde4;
      --muted: #8a93a1;
      --accent: #5aa9e6;
      --ok: #6cc08b;
      --err: #f0716c;
      --paper: #fbfaf7;
      --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }

    .app { height: 100%; display: flex; flex-direction: column; }

    /* ----- top bar ----- */
    .topbar {
      flex: none; display: flex; align-items: center; gap: 16px;
      height: 44px; padding: 0 14px; background: var(--bar); border-bottom: 1px solid var(--line);
    }
    .topbar h1 { font-size: 0.95rem; font-weight: 600; margin: 0; letter-spacing: -0.005em; white-space: nowrap; }
    .spacer { flex: 1; }
    .hint { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
    @media (max-width: 760px) { .hint { display: none; } }
    kbd { font-family: var(--mono); font-size: 0.74rem; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; background: var(--panel); }
    .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
    .toggle input { accent-color: var(--accent); }

    button { font-family: var(--sans); }
    button.run {
      font-size: 0.85rem; font-weight: 600; padding: 6px 14px; border: 0; border-radius: 4px;
      cursor: pointer; background: var(--accent); color: #0d1620; white-space: nowrap;
    }
    button.run:hover:not(:disabled) { background: #74b8ee; }
    button.run:disabled { opacity: 0.6; cursor: progress; }
    button:focus-visible, .tab:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ----- workspace: editor fills everything; diagram pane joins on success ----- */
    .workspace { flex: 1; min-height: 0; display: flex; }
    .editor-pane { flex: 1; min-width: 0; position: relative; }
    .editor { position: absolute; inset: 0; }
    .editor-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.85rem; }
    .fallback-editor {
      position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0;
      background: var(--bg); color: var(--text); padding: 12px; font-family: var(--mono); font-size: 14px;
    }

    .result-pane {
      flex: none; width: 46%; min-width: 320px; display: flex; flex-direction: column;
      border-left: 1px solid var(--line); background: var(--bar);
      animation: pane-in 180ms ease-out;
    }
    @keyframes pane-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .result-pane { animation: none; } }
    @media (max-width: 800px) {
      .workspace { flex-direction: column; }
      .result-pane { width: auto; min-width: 0; height: 50%; border-left: 0; border-top: 1px solid var(--line); }
    }

    .tabs { flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
    .tab {
      font-size: 0.85rem; background: none; border: 0; color: var(--muted);
      padding: 10px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .stale { margin-left: 8px; font-size: 0.78rem; color: var(--err); }
    .icon-btn { background: none; border: 0; color: var(--muted); font-size: 1.2rem; line-height: 1; padding: 6px 8px; cursor: pointer; border-radius: 4px; }
    .icon-btn:hover { color: var(--text); background: var(--panel); }

    .result-body { flex: 1; min-height: 0; overflow: auto; }
    .diagram { height: 100%; background: var(--paper); padding: 16px; display: flex; align-items: center; justify-content: center; }
    .diagram.stale-view { opacity: 0.45; }
    .diagram svg { max-width: 100%; max-height: 100%; height: auto; }
    .diagram .empty { color: #b4332d; font-size: 0.9rem; text-align: center; max-width: 36ch; line-height: 1.5; }
    .source { margin: 0; padding: 14px; font-family: var(--mono); font-size: 0.84rem; line-height: 1.5; color: var(--text); white-space: pre-wrap; }

    /* ----- bottom log bar ----- */
    .logbar { flex: none; background: var(--bar); border-top: 1px solid var(--line); }
    .logbar-head {
      display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 14px;
      width: 100%; border: 0; background: none; color: var(--text); text-align: left; cursor: pointer; font-size: 0.82rem;
    }
    .logbar-head:hover { background: var(--panel); }
    .logbar-line { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); color: var(--muted); }
    .chev { color: var(--muted); }
    .log {
      margin: 0; height: 150px; overflow: auto; padding: 10px 14px; border-top: 1px solid var(--line);
      background: #0f1216; font-family: var(--mono); font-size: 0.84rem; line-height: 1.5; white-space: pre-wrap; color: #b8e0c6;
    }
    .log.error { color: #f6a6a2; }

    .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status.ok { color: var(--ok); } .status.ok .dot { background: var(--ok); }
    .status.error { color: var(--err); } .status.error .dot { background: var(--err); }
    .status.running .dot { background: var(--accent); }
  </style>

  <!-- React first: its UMD build must load before Monaco's AMD loader defines a global `define`. -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect, useCallback } = React;

    /* ---------- Monaco loading ---------- */

    const MONACO_BASE = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min";
    let monacoPromise = null;

    function registerDfaLanguage(monaco) {
      monaco.languages.register({ id: "dfa" });
      monaco.languages.setMonarchTokensProvider("dfa", {
        keywords: ["delta", "DELTA"],
        tokenizer: {
          root: [
            [/[A-Za-z_]\w*/, { cases: { "@keywords": "keyword", "@default": "identifier" } }],
            [/\d+/, "number"],
            [/[{}()]/, "delimiter.bracket"],
            [/[,=]/, "delimiter"],
          ],
        },
      });
    }

    function loadMonaco() {
      if (!monacoPromise) {
        monacoPromise = new Promise((resolve, reject) => {
          if (!window.require || !window.require.config) {
            reject(new Error("Monaco loader not available"));
            return;
          }
          // Monaco's web workers must be same-origin, so wrap the CDN worker in a data: URL.
          window.MonacoEnvironment = {
            getWorkerUrl() {
              const src =
                `self.MonacoEnvironment = { baseUrl: '${MONACO_BASE}/' };` +
                `importScripts('${MONACO_BASE}/vs/base/worker/workerMain.js');`;
              return "data:text/javascript;charset=utf-8," + encodeURIComponent(src);
            },
          };
          window.require.config({ paths: { vs: `${MONACO_BASE}/vs` } });
          window.require(
            ["vs/editor/editor.main"],
            () => {
              registerDfaLanguage(window.monaco);
              resolve(window.monaco);
            },
            reject
          );
        });
        monacoPromise.catch(() => { monacoPromise = null; });
      }
      return monacoPromise;
    }

    /* ---------- Graphviz (client-side layout) ---------- */

    let graphvizPromise = null;

    function renderDot(dot) {
      if (!graphvizPromise) {
        graphvizPromise = import("https://cdn.jsdelivr.net/npm/@hpcc-js/wasm@2.12.0/dist/graphviz.js")
          .then((mod) => mod.Graphviz.load());
        graphvizPromise.catch(() => { graphvizPromise = null; });
      }
      return graphvizPromise.then((gv) => gv.layout(dot, "svg", "dot"));
    }

    /* ---------- Components ---------- */

    function CodeEditor({ value, onChange, onRun }) {
      const hostRef = useRef(null);
      const onChangeRef = useRef(onChange);
      const onRunRef = useRef(onRun);
      onChangeRef.current = onChange;
      onRunRef.current = onRun;

      const [ready, setReady] = useState(false);
      const [failed, setFailed] = useState(false);

      useEffect(() => {
        let editor = null;
        let disposed = false;

        loadMonaco()
          .then((monaco) => {
            if (disposed || !hostRef.current) return;
            editor = monaco.editor.create(hostRef.current, {
              value,
              language: "dfa",
              theme: "vs-dark",
              fontFamily: "'IBM Plex Mono', Menlo, Consolas, monospace",
              fontSize: 15,
              minimap: { enabled: false },
              automaticLayout: true,
              scrollBeyondLastLine: false,
              tabSize: 2,
              padding: { top: 16, bottom: 16 },
            });
            editor.onDidChangeModelContent(() => onChangeRef.current(editor.getValue()));
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => onRunRef.current());
            editor.focus();
            setReady(true);
          })
          .catch(() => { if (!disposed) setFailed(true); });

        return () => {
          disposed = true;
          if (editor) editor.dispose();
        };
        // The editor owns its text after creation, so it is only created once.
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      if (failed) {
        return (
          <div className="editor-pane">
            <textarea
              className="fallback-editor"
              aria-label="DFA specification"
              value={value}
              onChange={(e) => onChange(e.target.value)}
              onKeyDown={(e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") onRun(); }}
            />
          </div>
        );
      }

      return (
        <div className="editor-pane">
          <div ref={hostRef} className="editor" aria-label="DFA specification" />
          {!ready && <div className="editor-loading">Loading editor…</div>}
        </div>
      );
    }

    function StatusBadge({ status }) {
      const labels = { idle: "Ready", running: "Compiling…", ok: "Valid DFA", error: "Compilation failed" };
      return (
        <span className={"status " + status} role="status">
          <span className="dot" />
          {labels[status]}
        </span>
      );
    }

    function ResultPane({ svg, dot, json, stale, diagramError, onClose }) {
      const [tab, setTab] = useState("diagram");
      const tabs = [
        { id: "diagram", label: "Diagram" },
        { id: "dot", label: "DOT" },
        { id: "json", label: "JSON" },
      ];

      return (
        <aside className="result-pane" aria-label="Compiler output">
          <div className="tabs" role="tablist">
            {tabs.map((t) => (
              <button
                key={t.id}
                role="tab"
                className="tab"
                aria-selected={tab === t.id}
                onClick={() => setTab(t.id)}
              >
                {t.label}
              </button>
            ))}
            {stale && <span className="stale">Out of date. Last compile failed.</span>}
            <span className="spacer" />
            <button className="icon-btn" onClick={onClose} aria-label="Close output panel" title="Close">×</button>
          </div>

          <div className="result-body">
            {tab === "diagram" && (
              svg
                ? <div className={"diagram" + (stale ? " stale-view" : "")} dangerouslySetInnerHTML={{ __html: svg }} />
                : <div className="diagram"><p className="empty">{diagramError || "No diagram available."}</p></div>
            )}
            {tab === "dot" && <pre className="source">{dot || "No DOT output."}</pre>}
            {tab === "json" && <pre className="source">{json || "The compiler did not write JSON output."}</pre>}
          </div>
        </aside>
      );
    }

    const SAMPLE = `M = ({q0, q1}, {a, b}, delta, q0, {q1})

delta(q0, a) = q1
delta(q0, b)
delta(q1, a)
delta(q1, b) = q0
`;

    function prettyJson(text) {
      if (!text) return "";
      try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; }
    }

    function App() {
      const [code, setCode] = useState(SAMPLE);
      const [status, setStatus] = useState("idle");
      const [log, setLog] = useState("Ready.");
      const [logOpen, setLogOpen] = useState(false);
      const [auto, setAuto] = useState(false);

      // The last successful compile. The result pane only exists once one has succeeded.
      const [good, setGood] = useState(null); // { svg, dot, json, diagramError }
      const [showPane, setShowPane] = useState(false);

      const codeRef = useRef(code);
      codeRef.current = code;
      const runningRef = useRef(false);
      const queuedRef = useRef(false);

      const compile = useCallback(async () => {
        if (runningRef.current) { queuedRef.current = true; return; }
        runningRef.current = true;
        setStatus("running");
        setLog("Compiling via backend…");

        try {
          const response = await fetch("/compile", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: codeRef.current }),
          });
          const data = await response.json();

          if (data.success) {
            let svg = "";
            let diagramError = "";
            if (data.dot) {
              try { svg = await renderDot(data.dot); }
              catch (err) {
                if (data.svg) svg = data.svg;
                else diagramError = "Could not draw the diagram: " + err.message;
              }
            } else if (data.svg) {
              svg = data.svg;
            } else {
              diagramError = "The compiler accepted the DFA but did not produce a diagram.";
            }

            setGood({ svg, dot: data.dot || "", json: prettyJson(data.json), diagramError });
            setShowPane(true);
            setStatus("ok");
            setLog(data.output || "Semantic analysis passed: valid DFA.");
            setLogOpen(false);
          } else {
            setStatus("error");
            setLog(data.errors || data.output || "Compilation error occurred.");
            setLogOpen(true);
          }
        } catch (err) {
          setStatus("error");
          setLog("Server error: " + err.message);
          setLogOpen(true);
        } finally {
          runningRef.current = false;
          if (queuedRef.current) { queuedRef.current = false; compile(); }
        }
      }, []);

      // Optional live mode: recompile shortly after typing stops.
      useEffect(() => {
        if (!auto) return;
        const id = setTimeout(compile, 700);
        return () => clearTimeout(id);
      }, [code, auto, compile]);

      const firstLine = log.split("\n").find((l) => l.trim()) || "";

      return (
        <div className="app">
          <div className="topbar">
            <h1>DFA compiler &amp; visualizer</h1>
            <span className="spacer" />
            <span className="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to compile</span>
            <label className="toggle">
              <input type="checkbox" checked={auto} onChange={(e) => setAuto(e.target.checked)} />
              Compile as I type
            </label>
            <button className="run" onClick={compile} disabled={status === "running"}>
              {status === "running" ? "Compiling…" : "Compile and render"}
            </button>
          </div>

          <div className="workspace">
            <CodeEditor value={code} onChange={setCode} onRun={compile} />
            {good && showPane && (
              <ResultPane
                svg={good.svg}
                dot={good.dot}
                json={good.json}
                diagramError={good.diagramError}
                stale={status === "error"}
                onClose={() => setShowPane(false)}
              />
            )}
          </div>

          <div className="logbar">
            <button className="logbar-head" onClick={() => setLogOpen((o) => !o)} aria-expanded={logOpen}>
              <StatusBadge status={status} />
              {!logOpen && <span className="logbar-line">{firstLine}</span>}
              {logOpen && <span className="logbar-line" />}
              <span className="chev">{logOpen ? "Hide log ▾" : "Show log ▴"}</span>
            </button>
            {logOpen && <pre className={"log" + (status === "error" ? " error" : "")} aria-live="polite">{log}</pre>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
